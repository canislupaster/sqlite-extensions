name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch: {}

jobs:
  prebuild:
    outputs:
      linux-x64: ${{ steps.artifact-ids.outputs.linux-x64 }}
      linux-arm64: ${{ steps.artifact-ids.outputs.linux-arm64 }}
      darwin-x64: ${{ steps.artifact-ids.outputs.darwin-x64 }}
      darwin-arm64: ${{ steps.artifact-ids.outputs.darwin-arm64 }}
      win32-x64: ${{ steps.artifact-ids.outputs.win32-x64 }}
      win32-arm64: ${{ steps.artifact-ids.outputs.win32-arm64 }}
      linuxmusl-x64: ${{ steps.artifact-ids.outputs.linuxmusl-x64 }}
      linuxmusl-arm64: ${{ steps.artifact-ids.outputs.linuxmusl-arm64 }}
      manifest: ${{ steps.artifact-ids.outputs.manifest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: manifest
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
            msvc-arch: x64
          - os: windows-11-arm
            target: win32-arm64
            msvc-arch: arm64
          - platform: linux/amd64
            target: linuxmusl-x64
            os: ubuntu-24.04
          - platform: linux/arm64
            target: linuxmusl-arm64
            os: ubuntu-24.04-arm
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sqlite/sqlite
          ref: version-3.53.4
          path: sqlite
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: ${{ runner.os == 'Windows' }}
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Build (Alpine)
        if: ${{ matrix.platform != '' }}
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            --volume "${{ github.workspace }}:/project" \
            --workdir /project \
            python:3-alpine \
            python build.py ${{ matrix.target }}
      - name: Build
        if: ${{ matrix.platform == '' }}
        run: python build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ matrix.target }}
          path: build/*
          if-no-files-found: error
      - name: Export artifact ID
        id: artifact-ids
        shell: bash
        run: echo "${{ matrix.target }}=${{ steps.upload.outputs.artifact-id }}" >> "$GITHUB_OUTPUT"

  test:
    needs: prebuild
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prebuild.outputs.artifact-ids }}
          path: .
          merge-multiple: true
      - name: Build package
        run: pnpm run build
      - name: Test package
        run: pnpm run test

  publish:
    if: ${{ github.event_name == 'release' }}
    needs: [prebuild, test]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ join(needs.prebuild.outputs.*) }}
          path: .
          merge-multiple: true
      - name: Build package
        run: pnpm run build
      - name: Publish package
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
